<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Clock</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="site-header">
      <div>
        <p class="eyebrow">World Clock</p>
        <h1>What time is it, everywhere?</h1>
      </div>
      <p id="local-summary" class="local-summary">Loading local time…</p>
    </header>

    <main>
      <section class="clock-grid" id="clock-grid" aria-live="polite"></section>
    </main>

    <footer>
      <p>Times update every second using your browser’s timezone data.</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
